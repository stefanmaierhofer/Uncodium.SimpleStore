name: Publish
on:
  push:
    branches:
      - main
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/publish.yml

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Check for Release
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Tools
        run: dotnet tool restore

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(dotnet aardpack --parse-only)
          if [ -z "$VERSION" ]; then
            echo "Error: dotnet aardpack --parse-only returned no version"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Release $VERSION is new."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test
    needs: release-check
    if: needs.release-check.outputs.should-skip != 'true'
    uses: ./.github/workflows/build.yml

  pack:
    name: Package
    needs: test
    runs-on: windows-latest
    permissions:
      id-token: write # GitHub OIDC token for NuGet trusted publishing
      contents: write # the GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore
        run: |
          dotnet paket restore
          dotnet restore src/Uncodium.SimpleStore.sln

      - name: Build
        run: dotnet build src/Uncodium.SimpleStore.sln --configuration Release --no-restore

      # Without a token aardpack only packs: the GitHub release follows the NuGet push, so a failed push leaves no
      # release and the next run (or a rerun) publishes again.
      - name: Pack
        run: dotnet aardpack src\Uncodium.SimpleStore.sln --notag --skip-build

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: bin\pack

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet
        shell: cmd
        run: dotnet nuget push "bin\pack\*.nupkg" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(dotnet aardpack --parse-only)
          awk 'NR > 1 && /^### / { exit } NR > 1 { print }' RELEASE_NOTES.md > notes.md
          gh release create "$VERSION" bin/pack/*.nupkg --title "$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
